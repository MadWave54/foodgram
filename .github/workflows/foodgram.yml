name: Foodgram CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to configured server
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodgram
          POSTGRES_USER: foodgram
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodgram"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_DB: foodgram
      POSTGRES_USER: foodgram
      POSTGRES_PASSWORD: test-password
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py test api
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          CI: 'false'
  publish:
    if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/foodgram-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/foodgram-frontend:latest
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/foodgram/infra
            docker compose pull backend frontend
            docker compose up -d --no-build
            docker compose exec -T backend python manage.py load_ingredients
