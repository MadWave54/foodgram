name: foodgram
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodgram}
      POSTGRES_USER: ${POSTGRES_USER:-foodgram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodgram-local-password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    image: ${DOCKERHUB_USERNAME:-local}/foodgram-backend:latest
    build: ../backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodgram}
      POSTGRES_USER: ${POSTGRES_USER:-foodgram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodgram-local-password}
      DB_HOST: db
      SECRET_KEY: ${SECRET_KEY:-foodgram-local-development-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - ../data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/foodgram-frontend:latest
    build: ../frontend
    volumes:
      - frontend:/app/result_build
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${FOODGRAM_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend:/usr/share/nginx/html:ro
      - ../docs:/var/html/docs:ro
      - static:/var/html/static:ro
      - media:/var/html/media:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped
volumes:
  database:
  static:
  media:
  frontend:
